name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nexus-estate/nexus-estate-web

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --ci --no-cache
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  e2e-integration-platform-lifecycle:
    name: Full-stack Platform Lifecycle E2E
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout web
        uses: actions/checkout@v4

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: nexus-estate/nexus-estate-api
          ref: develop
          path: api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Start isolated PostgreSQL
        working-directory: api
        run: |
          cp .env.example .env
          {
            echo 'POSTGRES_USER=postgres'
            echo 'POSTGRES_PASSWORD=postgres'
            echo 'POSTGRES_DB=nexus_estate_dev'
          } >> .env
          docker compose up -d postgres
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres -d nexus_estate_dev; then exit 0; fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Run API migrations
        working-directory: api
        env:
          NODE_ENV: development
          DB_POSTGRES_HOST: localhost
          DB_POSTGRES_PORT: 5432
          DB_POSTGRES_USER: postgres
          DB_POSTGRES_PASS: postgres
          DB_POSTGRES_NAME: nexus_estate_dev
          DB_POSTGRES_ADMIN_NAME: postgres
          CUSTOMER_JWT_ACCESS_SECRET: ci-lifecycle-customer-access-secret-32
          CUSTOMER_JWT_REFRESH_SECRET: ci-lifecycle-customer-refresh-secret-32
          ADMIN_JWT_ACCESS_SECRET: ci-lifecycle-admin-access-secret-32
          ADMIN_JWT_REFRESH_SECRET: ci-lifecycle-admin-refresh-secret-32
          INITIAL_ADMIN_EMAIL: superadmin@nexus-estate.local
          INITIAL_ADMIN_PASSWORD: NexusEstate#SuperAdmin2026!
          CORS_ORIGINS: http://localhost:3000
          SWAGGER_ENABLED: 'false'
        run: npm run migration:run:prod

      - name: Start API
        working-directory: api
        env:
          NODE_ENV: development
          PORT: 50001
          DB_POSTGRES_HOST: localhost
          DB_POSTGRES_PORT: 5432
          DB_POSTGRES_USER: postgres
          DB_POSTGRES_PASS: postgres
          DB_POSTGRES_NAME: nexus_estate_dev
          CUSTOMER_JWT_ACCESS_SECRET: ci-lifecycle-customer-access-secret-32
          CUSTOMER_JWT_REFRESH_SECRET: ci-lifecycle-customer-refresh-secret-32
          ADMIN_JWT_ACCESS_SECRET: ci-lifecycle-admin-access-secret-32
          ADMIN_JWT_REFRESH_SECRET: ci-lifecycle-admin-refresh-secret-32
          CORS_ORIGINS: http://localhost:3000
          SWAGGER_ENABLED: 'false'
        run: nohup npm run start:prod > /tmp/nexus-estate-api.log 2>&1 &

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:50001/health/live; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexus-estate-api.log
          exit 1

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full-stack lifecycle E2E
        env:
          E2E_INTEGRATION: 'true'
          NEXT_PUBLIC_API_URL: http://localhost:50001/api/v1
        run: npm run test:e2e -- platform-lifecycle.spec.ts

      - name: Upload lifecycle diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-lifecycle-playwright-report
          path: |
            playwright-report/
            /tmp/nexus-estate-api.log
          retention-days: 30

  docker-validate:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:50001/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci, e2e-integration-platform-lifecycle]
    permissions:
      contents: read
      packages: write
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/develop' && 'https://api-staging.167.233.211.87.nip.io/api/v1' || 'https://api.167.233.211.87.nip.io/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
